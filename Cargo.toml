[package]
name = "ChronaEngine"
version = "1.0.0"
edition = "2024"

[dependencies]
winit = "0.30.13"
vulkano = "0.35.2"

chrona_app = { path = "crates/chrona_app" }
chrona_utils = { path = "crates/chrona_utils" }
chrona_engine = { path = "crates/chrona_engine"}
chrona_api = { path = "crates/chrona_api" }
chrona_world = { path = "crates/chrona_world" }

[workspace]
members = [
    "crates/chrona_engine",
    "crates/chrona_app",
    "crates/chrona_utils",
    "crates/chrona_api",
    "crates/chrona_vk"
, "crates/chrona_world"]

[profile.dev]
opt-level = 1
